# Bootstrap the asset bucket once the object store is up: public read and CORS so stac-browser (a
# client-side app) can fetch thumbnails. Runs `eo_ingest.bucket` from the one ingester image (loaded
# into kind by `make up`), so no extra client image is needed. Idempotent, so re-applying is safe.
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-bootstrap
  namespace: eo
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: minio-bucket-bootstrap
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: eo-ingest:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "eo_ingest.bucket"]
          env:
            - name: S3_ENDPOINT_URL
              value: http://minio:9000
            - name: S3_BUCKET
              value: eo-assets
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
