# The S3-compatible object store (RustFS; the name `minio` is historical), a single-container
# Deployment (plain manifest, core profile). Storage is emptyDir: ephemeral on purpose for the local demo; the prod profile swaps
# in a PVC. Image pinned by digest.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: eo
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          # RustFS, an Apache-2.0 S3-compatible server: MinIO's community images are no longer
          # published on Docker Hub (Nov 2026). Names (minio, minio-credentials) are kept so the
          # workflows, Makefile and port-forwards are unchanged.
          image: rustfs/rustfs:1.0.6@sha256:ee717072290bec9b11abfc0365f8310b00df1cd9b3639943edae47bdef05044a
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_USER
            - name: RUSTFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: MINIO_ROOT_PASSWORD
            - name: RUSTFS_CONSOLE_ENABLE
              value: "true"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
